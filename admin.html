<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TripMates Admin Panel</title>
    <!-- Add your Bootstrap CSS link here if you use it for styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
       
    </style>
</head>
<body>
    <div class="container">
        <h1 class="mb-4 text-center">TripMates Admin Panel</h1>
        <p id="admin-status">Checking admin status...</p>
        <button id="admin-signout" class="btn btn-warning mb-4" style="display: none;">Admin Sign Out</button>

        <div id="admin-content" style="display: none;">
            <div class="data-table">
                <h2>All Users</h2>
                <table class="table table-striped table-bordered">
                    <thead>
                        <tr>
                            <th>UID</th>
                            <th>Email</th>
                            <th>Full Name</th>
                            <th>Phone Number</th>
                            <th>Travel Type</th>
                            <th>Joined At</th>
                        </tr>
                    </thead>
                    <tbody id="users-table-body">
                        <!-- User data will be loaded here -->
                    </tbody>
                </table>
            </div>

            <div class="data-table">
                <h2>All Tour Plans</h2>
                <table class="table table-striped table-bordered">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>User ID</th>
                            <th>Destination</th>
                            <th>Location</th>
                            <th>Departure</th>
                            <th>Budget</th>
                            <th>Adults</th>
                            <th>Children</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Submitted At</th>
                        </tr>
                    </thead>
                    <tbody id="tour-plans-table-body">
                        <!-- Tour plan data will be loaded here -->
                    </tbody>
                </table>
            </div>
        </div>
        <div id="not-authorized" class="alert alert-danger" style="display: none;">
            You are not authorized to view this page. Please log in as an administrator.
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Your Admin JavaScript -->
    <script type="module" src="admin.js"></script>
</body>
</html>
